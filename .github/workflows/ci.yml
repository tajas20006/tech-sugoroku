name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check techsugoroku/ tests/

      - name: Pytest
        run: uv run --with pytest-cov pytest --cov=techsugoroku --cov-branch --cov-report=term-missing --cov-report=xml
